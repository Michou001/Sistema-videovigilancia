# Configuracion de Alembic para uso desde la linea de comandos.
#
# La API aplica las migraciones sola al arrancar; esto solo hace falta para
# generar una migracion nueva despues de cambiar api/models.py:
#
#     alembic revision --autogenerate -m "descripcion"
#
# La URL de la base de datos NO va aqui: se toma de DATABASE_URL (ver
# api/migraciones/env.py).

[alembic]
script_location = %(here)s/api/migraciones
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
