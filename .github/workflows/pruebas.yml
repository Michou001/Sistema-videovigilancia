# Integracion continua: en cada push y pull request corre el linter y todas
# las pruebas (sin GPU ni camaras), en Linux y en Windows -- el sistema se
# despliega en los dos -- y ademas contra PostgreSQL y Redis reales.
name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            constraints.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt -c constraints.txt

      - name: Linter
        run: ruff check .

      - name: Pruebas (SQLite)
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/correr_todas.py

  servicios:
    name: PostgreSQL 16 + Redis 7
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pruebas
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            constraints.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt -c constraints.txt
      - name: Pruebas contra PostgreSQL y Redis
        env:
          PYTHONIOENCODING: utf-8
          PRUEBAS_POSTGRES: postgresql+psycopg://postgres:pruebas@localhost:5432/postgres
          PRUEBAS_REDIS: redis://localhost:6379/15
        run: python tests/correr_todas.py
