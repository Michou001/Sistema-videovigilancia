# Integracion continua: en cada push y pull request corre el linter y todas
# las pruebas (sin GPU ni camaras), en Linux y en Windows -- el sistema se
# despliega en los dos.
name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            constraints.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt -c constraints.txt

      - name: Linter
        run: ruff check .

      - name: Pruebas
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/correr_todas.py
